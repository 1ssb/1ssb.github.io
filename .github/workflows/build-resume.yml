name: Build resume PDF

# Rebuild resume/Resume.pdf whenever the LaTeX sources change. latexmk runs
# every xelatex pass (references, layout) it needs in one invocation, so there
# is no manual double-compile and the committed PDF always matches the sources.
on:
  push:
    branches: [main]
    paths:
      - "resume/**.tex"
      - "resume/**.sty"
      - ".github/workflows/build-resume.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-resume
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile resume (latexmk + xelatex — all passes in one run)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: resume
          root_file: main.tex
          latexmk_use_xelatex: true

      - name: Name the output Resume.pdf
        run: mv -f resume/main.pdf resume/Resume.pdf

      - name: Commit the PDF if it changed
        run: |
          if git diff --quiet -- resume/Resume.pdf; then
            echo "Resume.pdf unchanged — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add resume/Resume.pdf
            git commit -m "ci: rebuild Resume.pdf [skip ci]"
            git push
          fi
