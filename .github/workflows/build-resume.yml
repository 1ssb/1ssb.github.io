name: Build resume PDF

# Rebuild resume/Resume.pdf whenever the LaTeX sources change. latexmk runs
# every xelatex pass (references, layout) it needs in one invocation, so there
# is no manual double-compile and the committed PDF always matches the sources.
on:
  push:
    branches: [main]
    paths:
      - "resume/**.tex"
      - "resume/**.sty"
      - ".github/workflows/build-resume.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-resume
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live (xelatex + moderncv + latexmk)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-lang-english \
            lmodern latexmk

      - name: Build Resume.pdf
        working-directory: resume
        # latexmk runs xelatex as many times as the document needs (refs, layout)
        # in a single invocation, and -jobname writes Resume.pdf directly.
        run: latexmk -xelatex -interaction=nonstopmode -halt-on-error -jobname=Resume main.tex

      - name: Render résumé page images for the web viewer
        # The /resume/ viewer shows these images so the résumé displays on every
        # device; regenerating here keeps them in sync with the compiled PDF.
        run: |
          python3 -m pip install --quiet --break-system-packages PyMuPDF Pillow
          python3 resume/render_images.py

      - name: Commit the PDF and page images if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume/Resume.pdf resume/assets/*.jpg
          if git diff --cached --quiet; then
            echo "Résumé outputs unchanged — nothing to commit."
          else
            git commit -m "ci: rebuild Resume.pdf + résumé page images"
            git push
          fi
