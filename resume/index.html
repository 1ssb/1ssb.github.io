  <style>
    :root {
      --bg: #0b0d12;
      --panel: rgba(15, 19, 27, 0.92);
      --border: #232a36;
      --text: #e6edf3;
      --muted: #9aa4b2;
      --accent: #00b4d8;
      --accent2: #ffb703;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .bar a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .bar .home {
      color: var(--muted);
    }

    .bar .home:hover,
    .bar .home:focus-visible {
      color: var(--accent);
    }

    .bar svg {
      width: 18px;
      height: 18px;
    }

    .bar-title {
      flex: 1;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .open {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .open:hover,
    .open:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
    }

    .stage {
      flex: 1 1 auto;
      overflow-y: auto;
      background: #16181d;
      padding: 26px 16px 60px;
    }

    .doc {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .page {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .fab {
      position: fixed;
      right: 24px;
      bottom: 28px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #08131a;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.5);
      z-index: 30;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .fab:hover {
      transform: translateY(-3px) scale(1.06);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.6);
    }

    .fab:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }

    .fab svg {
      width: 28px;
      height: 28px;
    }

    @media (max-width: 600px) {
      .bar-title {
        display: none;
      }

      .fab {
        width: 56px;
        height: 56px;
        right: 16px;
        bottom: 20px;
      }

      .fab svg {
        width: 25px;
        height: 25px;
      }
    }
  </style>
</head>
